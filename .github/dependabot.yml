# Actualizaciones automáticas de dependencias.
# Referencia: https://docs.github.com/code-security/dependabot
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-development:
        dependency-type: development
